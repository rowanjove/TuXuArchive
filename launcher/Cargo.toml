[package]
name = "tuxu-archive-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "图序归档免安装自解压启动器"

[[bin]]
name = "TuXuArchive_v1_0_x64"
path = "src/main.rs"

[dependencies]
hex = "0.4"
sha2 = "0.10"
winreg = "0.55"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
tauri-winres = "0.3.7"
